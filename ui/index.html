<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BoardTool</title>
  <link rel="stylesheet" href="/__app/app.css">
  <script type="module" src="/__app/app.js"></script>
</head>
<body>
  <nav aria-label="BoardTool">
    <a href="/__app/tokens.html">Tokens</a>
    <a href="/__app/components.html">Components</a>
    <hr>
    <ul id="pages"></ul>
  </nav>
  <main>
    <p id="status" role="alert" hidden></p>
    <div id="toolbar" hidden>
      <span id="page-frame"></span>
      <button type="button" id="edit-page" class="icon-button" aria-label="Edit page frame" title="Edit page frame"><span class="icon icon-frame"></span></button>
      <div id="filter" role="group" aria-label="Filter by tag"></div>
      <button type="button" id="edit-tags" class="icon-button" aria-label="Manage tags" title="Manage tags"><span class="icon icon-tags"></span></button>
      <div id="preview-size" role="group" aria-label="Preview size">
        <button type="button" value="small" class="icon-button" aria-label="Small previews" title="Small previews"><span class="icon icon-grid-3x3"></span></button>
        <button type="button" value="large" class="icon-button" aria-label="Large previews" title="Large previews"><span class="icon icon-grid-2x2"></span></button>
      </div>
    </div>
    <p id="empty" hidden>No boards yet. Add HTML files to <code>boards/&lt;page&gt;/</code>.</p>
    <ul id="boards"></ul>
  </main>
  <template id="board">
    <li class="board">
      <div class="preview"><iframe loading="lazy" inert></iframe></div>
      <a></a>
      <ul class="tags"></ul>
      <p class="note"></p>
      <div class="board-actions">
        <button type="button" class="icon-button frame-button" title="Edit frame"><span class="icon icon-pencil"></span></button>
        <button type="button" class="icon-button note-button" title="Edit note"><span class="icon icon-sticky-note"></span></button>
        <button type="button" class="icon-button tags-button" title="Edit tags"><span class="icon icon-tag"></span></button>
      </div>
    </li>
  </template>
  <dialog id="frame-dialog">
    <form method="dialog">
      <h2></h2>
      <label>Width <input name="width" type="number" min="1" step="1"></label>
      <label>Height <input name="height" type="number" min="1" step="1"></label>
      <p class="hint">Empty fields use the page frame.</p>
      <div class="actions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save">Save</button>
      </div>
    </form>
  </dialog>
  <dialog id="board-tags-dialog">
    <form method="dialog">
      <h2></h2>
      <div class="tag-choices"></div>
      <div class="actions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save">Save</button>
      </div>
    </form>
  </dialog>
  <dialog id="page-dialog">
    <form method="dialog">
      <h2></h2>
      <label>Width <input name="width" type="number" min="1" step="1" required></label>
      <label>Height <input name="height" type="number" min="1" step="1" required></label>
      <div class="actions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save">Save</button>
      </div>
    </form>
  </dialog>
  <dialog id="note-dialog">
    <form method="dialog">
      <h2></h2>
      <label>Note <textarea name="note" rows="6"></textarea></label>
      <p class="hint">The agent reads it before editing the board.</p>
      <div class="actions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save">Save</button>
      </div>
    </form>
  </dialog>
  <dialog id="tags-dialog">
    <form method="dialog">
      <h2>Tags</h2>
      <ul class="tag-list"></ul>
      <button type="button" class="add-tag">Add tag</button>
      <div class="actions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
